<!doctype html>
<html lang="nl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flow Field — Training</title><link rel="stylesheet" href="css/style.css"></head>
<body>
<header class="topbar"><div class="brand">FLOW FIELD</div><div id="phaseLabel">Voorbereiding</div><div id="timer">10:00</div></header>
<main class="training">
  <div class="instruction" id="instruction">Fixeer het centrale punt.</div>
  <div id="mandala" class="mandala-stage"></div>
  <div id="responseArea" class="response-area"></div>
  <div class="progress"><div id="progressBar"></div></div>
</main>
<div class="overlay" id="startOverlay"><div class="card start-card">
  <h1>10 minuten</h1>
  <p>Je ogen blijven zoveel mogelijk op het centrale punt. Reageer alleen wanneer de website daarom vraagt.</p>
  <p class="small">Gebruik bij voorkeur fullscreen en ongeveer 60–70 cm van het scherm.</p>
  <button class="primary" id="startBtn">START</button>
</div></div>
<script src="js/mandala.js"></script><script src="js/protocol.js"></script>
</body></html>
